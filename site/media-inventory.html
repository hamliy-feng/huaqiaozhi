<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>华侨志·图片收集清单</title>
<style>body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Microsoft Yahei",sans-serif;margin:0;background:#f4eddf;color:#51391e}header{padding:24px 18px;background:#fff8eb;border-bottom:1px solid #dac5a2}main{max-width:1100px;margin:auto;padding:18px}h1{font-size:24px;margin:0}.note{color:#82684a;font-size:12px}a{color:#785022}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}input,select{background:#fff;border:1px solid #d4b991;padding:10px;border-radius:7px;min-width:100px;flex:1}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{background:#fffaf2;border:1px solid #ddc7a6;border-radius:9px;padding:10px;display:flex;gap:12px;min-width:0}.pic{width:85px;height:85px;flex:0 0 85px;object-fit:cover;border-radius:5px;background:#e9deca}.body{min-width:0}.name{font-weight:650;overflow-wrap:anywhere}.id{font-size:10px;color:#967954;overflow-wrap:anywhere;margin:4px 0}.links{display:flex;gap:12px;font-size:12px}#count{margin:14px 0;color:#82684a}@media(max-width:700px){.items{grid-template-columns:1fr}header{padding:18px 12px}main{padding:12px}}</style>
<header><h1>图片收集清单</h1><p class="note">人物、组织、城市、事件的真实ID和图片状态。支持手机浏览和搜索，不把检索候选当成已确认图片。</p></header>
<main><div class="tools"><input id="q" placeholder="姓名、地名或ID"><select id="kind"><option value="">全部类别</option><option value="person">人物</option><option value="org">组织</option><option value="place">城市</option><option value="event">事件</option></select><select id="stat"><option value="">全部状态</option><option value="ready">已接入</option><option value="missing">待补图</option></select></div><p id="count"></p><p><a href="media-tasks.csv" download>下载CSV（Excel可打开）</a></p><div id="items" class="items"></div></main><script src="assets/media-inventory.js" defer></script></html>
